<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="#fafcff"/><text x="600" y="48" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#254b70">Insect Metamorphosis</text><g font-family="Arial" font-weight="700"><text x="300" y="115" text-anchor="middle" font-size="27" fill="#245c35">Complete</text><text x="900" y="115" text-anchor="middle" font-size="27" fill="#7b4c22">Incomplete</text></g><g font-family="Arial" font-size="20" fill="#2f3c48"><text x="90" y="220">Egg</text><text x="255" y="220">Larva</text><text x="420" y="220">Pupa</text><text x="565" y="220">Adult</text><text x="705" y="220">Egg</text><text x="875" y="220">Nymph</text><text x="1050" y="220">Adult</text></g><g stroke="#537891" stroke-width="5"><line x1="125" y1="250" x2="220" y2="250"/><line x1="300" y1="250" x2="390" y2="250"/><line x1="470" y1="250" x2="545" y2="250"/><line x1="745" y1="250" x2="835" y2="250"/><line x1="930" y1="250" x2="1020" y2="250"/></g><g fill="#d6dce2" stroke="#65727c" stroke-width="3"><ellipse cx="105" cy="330" rx="28" ry="38"/><ellipse cx="270" cy="330" rx="65" ry="28"/><ellipse cx="435" cy="330" rx="30" ry="65"/><ellipse cx="560" cy="330" rx="42" ry="60"/><ellipse cx="720" cy="330" rx="28" ry="38"/><ellipse cx="885" cy="330" rx="48" ry="34"/><ellipse cx="1060" cy="330" rx="42" ry="60"/></g><text x="300" y="500" text-anchor="middle" font-size="21" font-family="Arial" fill="#42604b">Egg → larva → pupa → adult</text><text x="900" y="500" text-anchor="middle" font-size="21" font-family="Arial" fill="#795434">Egg → nymph → adult</text><text x="600" y="585" text-anchor="middle" font-size="20" font-family="Arial" fill="#536170">Key visual: the pupal stage occurs only in complete metamorphosis.</text></svg>
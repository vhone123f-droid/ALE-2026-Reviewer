<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect width="100%" height="100%" fill="#fafcff"/><text x="550" y="48" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#20486a">Supply and Demand</text><g stroke="#4c6277" stroke-width="4"><line x1="160" y1="600" x2="950" y2="600"/><line x1="160" y1="600" x2="160" y2="120"/></g><line x1="230" y1="200" x2="840" y2="520" stroke="#dc2626" stroke-width="8"/><line x1="230" y1="520" x2="850" y2="190" stroke="#1d4ed8" stroke-width="8"/><circle cx="535" cy="360" r="11" fill="#14532d"/><g font-family="Arial" font-size="23" font-weight="700"><text x="845" y="535" fill="#dc2626">Demand</text><text x="855" y="190" fill="#1d4ed8">Supply</text><text x="555" y="350" fill="#14532d">Equilibrium</text><text x="930" y="640" fill="#43576a">Quantity</text><text x="95" y="150" fill="#43576a" transform="rotate(-90 95 150)">Price</text></g><text x="550" y="665" text-anchor="middle" font-size="19" font-family="Arial" fill="#516170">Demand slopes down; supply slopes up; equilibrium is where they intersect.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760"><rect width="100%" height="100%" fill="#faf9f4"/><text x="450" y="48" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#5d4930">Soil Profile</text><g font-family="Arial"><rect x="250" y="100" width="400" height="65" fill="#3d2f22"/><rect x="250" y="165" width="400" height="115" fill="#6f4f31"/><rect x="250" y="280" width="400" height="80" fill="#b5946a"/><rect x="250" y="360" width="400" height="135" fill="#9d6f43"/><rect x="250" y="495" width="400" height="120" fill="#c2a778"/><rect x="250" y="615" width="400" height="85" fill="#8a8580"/><g font-size="26" font-weight="700" fill="#fff"><text x="450" y="142" text-anchor="middle">O</text><text x="450" y="230" text-anchor="middle">A — Topsoil</text><text x="450" y="330" text-anchor="middle">E</text><text x="450" y="435" text-anchor="middle">B — Subsoil</text><text x="450" y="565" text-anchor="middle">C — Parent material</text><text x="450" y="670" text-anchor="middle">R — Bedrock</text></g></g><text x="450" y="735" text-anchor="middle" font-size="19" font-family="Arial" fill="#66594b">Not every soil has every horizon; the sequence is a common generalized profile.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="100%" height="100%" fill="#fbfaf5"/><text x="550" y="48" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#6a5330">Sand • Silt • Clay</text><g font-family="Arial" font-size="25" font-weight="700"><text x="190" y="135" text-anchor="middle" fill="#80603a">Sand</text><text x="550" y="135" text-anchor="middle" fill="#80603a">Silt</text><text x="910" y="135" text-anchor="middle" fill="#80603a">Clay</text></g><g fill="#caa36e"><circle cx="135" cy="260" r="35"/><circle cx="210" cy="240" r="42"/><circle cx="175" cy="325" r="38"/><circle cx="250" cy="315" r="33"/></g><g fill="#b79469"><circle cx="505" cy="250" r="20"/><circle cx="555" cy="238" r="19"/><circle cx="605" cy="255" r="18"/><circle cx="520" cy="300" r="17"/><circle cx="575" cy="300" r="19"/><circle cx="620" cy="315" r="16"/></g><g fill="#9c7651"><circle cx="860" cy="240" r="10"/><circle cx="890" cy="250" r="9"/><circle cx="920" cy="238" r="10"/><circle cx="950" cy="255" r="8"/><circle cx="875" cy="280" r="9"/><circle cx="905" cy="290" r="8"/><circle cx="938" cy="286" r="9"/><circle cx="970" cy="300" r="8"/></g><g font-family="Arial" font-size="20" fill="#66533d"><text x="190" y="430" text-anchor="middle">Large particles</text><text x="190" y="462" text-anchor="middle">Coarse / gritty feel</text><text x="550" y="430" text-anchor="middle">Medium particles</text><text x="550" y="462" text-anchor="middle">Smooth / floury feel</text><text x="910" y="430" text-anchor="middle">Very small particles</text><text x="910" y="462" text-anchor="middle">Sticky / plastic when wet</text></g><text x="550" y="575" text-anchor="middle" font-family="Arial" font-size="20" fill="#6d5a41">Texture depends on the relative proportions of sand, silt, and clay.</text></svg>
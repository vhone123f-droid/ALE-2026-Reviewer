<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="100%" height="100%" fill="#f7fcf5"/><text x="600" y="50" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#24522d">C3 vs C4 Photosynthesis</text>
<g font-family="Arial"><rect x="70" y="110" width="470" height="410" rx="24" fill="#fff" stroke="#9fc8a5" stroke-width="3"/><text x="305" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#23613a">C3</text><text x="305" y="198" text-anchor="middle" font-size="20">CO₂ enters leaf</text><text x="305" y="245" text-anchor="middle" font-size="42">↓</text><rect x="170" y="270" width="270" height="65" rx="14" fill="#e7f5e9" stroke="#9fc8a5"/><text x="305" y="311" text-anchor="middle" font-size="22">Calvin cycle / Rubisco</text><text x="305" y="370" text-anchor="middle" font-size="42">↓</text><rect x="160" y="395" width="290" height="65" rx="14" fill="#f1efe5" stroke="#bdb69c"/><text x="305" y="435" text-anchor="middle" font-size="21">First stable product: 3-C</text><text x="305" y="490" text-anchor="middle" font-size="18" fill="#536458">Rice • wheat • soybean • potato</text>
<rect x="660" y="110" width="470" height="410" rx="24" fill="#fff" stroke="#8bb2d2" stroke-width="3"/><text x="895" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#1f5680">C4</text><text x="895" y="198" text-anchor="middle" font-size="20">CO₂ first fixed in mesophyll</text><text x="895" y="245" text-anchor="middle" font-size="42">↓</text><rect x="760" y="270" width="270" height="65" rx="14" fill="#e7f2fb" stroke="#8bb2d2"/><text x="895" y="311" text-anchor="middle" font-size="22">4-C compound</text><text x="895" y="370" text-anchor="middle" font-size="42">↓</text><rect x="735" y="395" width="320" height="65" rx="14" fill="#f1efe5" stroke="#bdb69c"/><text x="895" y="435" text-anchor="middle" font-size="20">CO₂ concentrated → Calvin cycle</text><text x="895" y="490" text-anchor="middle" font-size="18" fill="#536458">Maize • sugarcane • sorghum</text></g>
<text x="600" y="575" text-anchor="middle" font-size="20" font-family="Arial" fill="#4e6352">Key contrast: C4 plants concentrate CO₂ and reduce photorespiration under hot, bright conditions.</text></svg>
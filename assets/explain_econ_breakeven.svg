<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect width="100%" height="100%" fill="#fbfcff"/><text x="550" y="48" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#27496a">Break-even Analysis</text><g stroke="#4c6277" stroke-width="4"><line x1="150" y1="600" x2="950" y2="600"/><line x1="150" y1="600" x2="150" y2="120"/></g><line x1="180" y1="540" x2="880" y2="180" stroke="#16a34a" stroke-width="8"/><line x1="180" y1="480" x2="880" y2="270" stroke="#dc2626" stroke-width="8"/><circle cx="570" cy="340" r="12" fill="#111827"/><g font-family="Arial" font-size="22" font-weight="700"><text x="850" y="175" fill="#16a34a">Total revenue</text><text x="840" y="300" fill="#dc2626">Total cost</text><text x="590" y="330" fill="#111827">Break-even</text><text x="420" y="520" fill="#9b1c1c">LOSS</text><text x="735" y="245" fill="#166534">PROFIT</text></g><text x="550" y="665" text-anchor="middle" font-size="19" font-family="Arial" fill="#516170">At break-even: Total Revenue = Total Cost.</text></svg>
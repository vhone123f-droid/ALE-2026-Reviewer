<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="100%" height="100%" fill="#fcfbff"/><text x="600" y="48" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#4a2f7d">Agricultural Marketing Flow</text><g font-family="Arial" font-size="23" font-weight="700" fill="#2e2540"><rect x="65" y="220" width="175" height="85" rx="16" fill="#ece7ff" stroke="#b7a6e6"/><text x="152" y="271" text-anchor="middle">Producer</text><rect x="315" y="220" width="180" height="85" rx="16" fill="#ece7ff" stroke="#b7a6e6"/><text x="405" y="271" text-anchor="middle">Assembler</text><rect x="570" y="220" width="180" height="85" rx="16" fill="#ece7ff" stroke="#b7a6e6"/><text x="660" y="271" text-anchor="middle">Wholesaler</text><rect x="825" y="220" width="160" height="85" rx="16" fill="#ece7ff" stroke="#b7a6e6"/><text x="905" y="271" text-anchor="middle">Retailer</text><rect x="1035" y="220" width="125" height="85" rx="16" fill="#ece7ff" stroke="#b7a6e6"/><text x="1097" y="271" text-anchor="middle">Consumer</text></g><g stroke="#7c68b1" stroke-width="7"><line x1="240" y1="262" x2="315" y2="262"/><line x1="495" y1="262" x2="570" y2="262"/><line x1="750" y1="262" x2="825" y2="262"/><line x1="985" y1="262" x2="1035" y2="262"/></g><text x="600" y="430" text-anchor="middle" font-size="19" font-family="Arial" fill="#5b5370">Marketing functions add place, time, form, and possession utility along the channel.</text></svg>
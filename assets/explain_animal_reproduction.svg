<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680"><rect width="100%" height="100%" fill="#fffafd"/><text x="550" y="48" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700" fill="#7c355c">Basic Reproductive Hormone Flow</text><g font-family="Arial" font-size="24" font-weight="700"><rect x="390" y="105" width="320" height="70" rx="16" fill="#f4e7f0" stroke="#c79ab9"/><text x="550" y="148" text-anchor="middle" fill="#68304e">Hypothalamus: GnRH</text><rect x="390" y="250" width="320" height="70" rx="16" fill="#e9eefb" stroke="#9fadd0"/><text x="550" y="293" text-anchor="middle" fill="#354d7c">Pituitary: LH + FSH</text><rect x="145" y="430" width="330" height="85" rx="16" fill="#edf7eb" stroke="#9abf92"/><text x="310" y="465" text-anchor="middle" fill="#315c2d">Follicle / ovulation</text><text x="310" y="495" text-anchor="middle" font-size="18" fill="#315c2d">LH surge triggers ovulation</text><rect x="625" y="430" width="330" height="85" rx="16" fill="#fff0df" stroke="#d8ad78"/><text x="790" y="465" text-anchor="middle" fill="#70491e">Corpus luteum</text><text x="790" y="495" text-anchor="middle" font-size="18" fill="#70491e">Produces progesterone</text></g><g stroke="#8a7290" stroke-width="7" fill="none"><line x1="550" y1="175" x2="550" y2="250"/><path d="M500 320 C440 365 365 400 320 430"/><path d="M600 320 C665 360 735 395 775 430"/></g><text x="550" y="620" text-anchor="middle" font-size="20" font-family="Arial" fill="#705568">This is a simplified exam-review model, not a complete endocrine pathway.</text></svg>
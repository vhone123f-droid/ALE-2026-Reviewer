name: ALE reviewer Pages deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ale-pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static Pages directory
        run: |
          rm -rf _site
          mkdir -p _site/updates
          cp index.html manifest.json sw.js icon-192.png icon-512.png _site/
          cp question-bank-v*.json _site/
          cp updates/latest.json _site/updates/
          if [ -f updates/agri-current.json ]; then cp updates/agri-current.json _site/updates/; fi
          if [ -f updates/history.json ]; then cp updates/history.json _site/updates/; fi
          if [ -f updates/IMPORT_THIS_IF_NEEDED.json ]; then cp updates/IMPORT_THIS_IF_NEEDED.json _site/updates/; fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
